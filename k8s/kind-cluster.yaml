# kind = "Kubernetes IN Docker": a real Kubernetes cluster whose node is a Docker container.
# Not a Kubernetes object, so it is NOT listed in kustomization.yaml.
# Create:  kind create cluster --name triagebot --config k8s/kind-cluster.yaml
# Delete:  kind delete cluster --name triagebot
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Host port 30080 -> NodePort 30080 of the triagebot-api Service.
      # So the app is at http://localhost:30080 with no port-forward.
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
